[colors]
background = #000000
foreground = #ffffff
muted = #888888
active = #ffffff
inactive = #555555

[bar/main]
width = 100%
height = 26px
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2px
border-size = 0px
padding-left = 1
padding-right = 1
module-margin = 1
separator = |
separator-foreground = ${colors.muted}
font-0 = "JetBrainsMono Nerd Font:size=10;2"

modules-left = i3
modules-center = date
modules-right = cpu memory wlan battery pulseaudio

tray-position = right
tray-padding = 4
tray-background = ${colors.background}
cursor-click = pointer

[module/i3]
type = internal/i3
format = <label-state>
index-sort = true
wrapping-scroll = false

label-focused = %index%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.active}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-foreground = ${colors.inactive}
label-unfocused-padding = 2

label-urgent = %index%
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.foreground}
label-urgent-padding = 2

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
label = %date%  %time%
label-foreground = ${colors.foreground}

[module/cpu]
type = internal/cpu
interval = 2
format = 󰻠 <label>
label = %percentage%%
format-foreground = ${colors.foreground}

[module/memory]
type = internal/memory
interval = 2
format = 󰍛 <label>
label = %percentage_used%%
format-foreground = ${colors.foreground}

[module/wlan]
type = internal/network
interface-type = wireless
interval = 3.0
format-connected = <ramp-signal> <label-connected>
label-connected = %essid%
format-connected-foreground = ${colors.foreground}
ramp-signal-0 = 󰤟
ramp-signal-1 = 󰤢
ramp-signal-2 = 󰤥
ramp-signal-3 = 󰤨
format-disconnected = 󰤭 offline
format-disconnected-foreground = ${colors.muted}

[module/battery]
type = internal/battery
battery = BAT1
adapter = AC
full-at = 98
format-charging = <ramp-capacity> <label-charging>
label-charging = %percentage%%
format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%
format-full = 󰁹 full
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁽
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰁹
format-charging-foreground = ${colors.foreground}
format-discharging-foreground = ${colors.foreground}
format-full-foreground = ${colors.foreground}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
format-volume-foreground = ${colors.foreground}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
label-muted = 󰝟 muted
label-muted-foreground = ${colors.muted}

[module/tray]
type = internal/tray
